configuration:
  scan_interval:
    name: Abfrageintervall
    description: Wie oft (in Sekunden) die Boxen abgefragt werden.
  publish_sensors:
    name: Sensoren in Home Assistant anlegen
    description: Download, Upload, Internetstatus, verpasste Anrufe u. a. als Entitäten bereitstellen.
  verify_ssl:
    name: TLS-Zertifikate prüfen
    description: FRITZ!Boxen verwenden selbstsignierte Zertifikate – nur aktivieren, wenn ein gültiges Zertifikat hinterlegt ist.
  log_level:
    name: Protokollierungsstufe
    description: Detailgrad der Add-on-Protokolle.
  direct_access:
    name: Direktzugriff (ohne Home-Assistant-Menü)
    description: FritzHub zusätzlich über einen eigenen Port mit Benutzername und Passwort erreichbar machen – z. B. für eine Webseiten-Karte im Dashboard oder ein Wand-Tablet. Adresse http://<IP von Home Assistant>:<Port>.
  direct_port:
    name: Port für den Direktzugriff
    description: Standard 8765. Muss im Heimnetz frei sein.
  direct_username:
    name: Benutzername für den Direktzugriff
    description: Wird auf der Anmeldeseite abgefragt.
  direct_password:
    name: Passwort für den Direktzugriff
    description: Mindestens 8 Zeichen. Eine Änderung meldet alle Geräte ab.
