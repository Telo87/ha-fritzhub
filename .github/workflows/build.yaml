# Builds the add-on image for all architectures.
# - push / pull request: test build only
# - GitHub release published: push images + multi-arch manifest to GHCR
#   (ghcr.io/telo87/fritzhub). Afterwards make the package public on GitHub
#   and uncomment `image:` in fritzhub/config.yaml.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  APP: fritzhub
  REGISTRY_PREFIX: ghcr.io/telo87

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      version: ${{ steps.normalize.outputs.version }}
      publish: ${{ github.event_name == 'release' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ env.APP }}"

      # The info action returns JSON-quoted strings ("1.0.0") – strip the quotes
      - name: Normalize app information
        id: normalize
        env:
          NAME: ${{ steps.info.outputs.name }}
          DESCRIPTION: ${{ steps.info.outputs.description }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          unquote() { jq -r . <<<"$1" 2>/dev/null || echo "$1"; }
          {
            echo "name=$(unquote "$NAME")"
            echo "description=$(unquote "$DESCRIPTION")"
            echo "version=$(unquote "$VERSION")"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ env.APP }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ env.APP }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=https://github.com/Telo87/ha-fritzhub
          push: ${{ needs.prepare.outputs.publish }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.APP }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
