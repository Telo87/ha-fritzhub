name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-addon:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./fritzhub"

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r fritzhub/requirements.txt pytest
      - run: pytest -q

  build:
    name: Test build (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --amd64 \
            --target /data/fritzhub
