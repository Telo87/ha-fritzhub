# Builds the add-on images for all architectures and pushes them to GHCR
# when a release is published. Afterwards uncomment `image:` in
# fritzhub/config.yaml so that users download the image instead of
# building it on their Home Assistant host.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/fritzhub \
            --image "{arch}-addon-fritzhub" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}"
