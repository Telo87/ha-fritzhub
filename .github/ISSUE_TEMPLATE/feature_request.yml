name: 💡 Idee oder Wunsch
description: Vorschlag für eine neue Funktion oder Verbesserung
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Was wünschst du dir?
      description: Beschreibe die Funktion und wofür du sie brauchst.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Dein Netz (optional)
      description: Welche Boxen/Repeater nutzt du? Hilft zu verstehen, ob die FRITZ!Box die nötigen Daten liefert.
